<div class="block">
  <h1 class="title">
    <a class='episode_title' href='{{ site.url }}{{ post.url }}#{{ post.id | sha1:8 }}'>{{ post.title }}</a>
    <span class='episode_date subtitle'>
      {% if site.language == "en" %}
        {{ post.date | full_date_de }}
      {% else %}
        {% if post.datum %}
          {{ post.datum }}
        {% else %}
          {{ post.date }}
        {% endif %}
      {% endif %}
    </span>
    {% if post.subtitle %}<span class="subtitle">{{ post.subtitle }}</span>{% endif %}
  </h1>
</div>
